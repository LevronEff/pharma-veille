name: Veille offres pharmacie

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Récupérer les offres
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python scripts/fetch_offres.py
      - name: Commiter offres.json et data/csp.json s'ils ont changé
        run: |
          # updatedAt change à chaque exécution : on compare les offres et le cache CSP uniquement
          if git ls-files --error-unmatch offres.json >/dev/null 2>&1 \
             && git diff --quiet -- data/csp.json \
             && [ -z "$(git ls-files --others --exclude-standard data/csp.json)" ] \
             && python - <<'PY'
          import json, subprocess, sys
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:offres.json"]))
          new = json.load(open("offres.json", encoding="utf-8"))
          sys.exit(0 if old.get("offers") == new.get("offers") and old.get("sources", {}).keys() == new.get("sources", {}).keys()
                   and {k: v["ok"] for k, v in old.get("sources", {}).items()} == {k: v["ok"] for k, v in new["sources"].items()} else 1)
          PY
          then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offres.json
          [ -f data/csp.json ] && git add data/csp.json
          git commit -m "Mise à jour des offres"
          git push
